name: Collect internships

# Every night, read employer job boards and refresh data/internships.json.
# Free for public repositories. Committing the file triggers a Render redeploy,
# which is how the live site picks up the new listings.
on:
  schedule:
    - cron: '17 9 * * *' # 09:17 UTC daily (early morning in the US)
  workflow_dispatch:
  push:
    branches: [phase2-local-internships]
    paths:
      - 'scripts/collect-internships.mjs'
      - 'data/employers.json'
      - 'lib/locations.mjs'
      - '.github/workflows/collect-internships.yml'

permissions:
  contents: write

concurrency:
  group: collect-internships
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Collect
        run: node scripts/collect-internships.mjs
      - name: Commit if changed
        run: |
          git config user.name "fieldwork-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/internships.json data/internships-report.json
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Update internship listings ($(date -u +%Y-%m-%d))"
            git push
          fi
