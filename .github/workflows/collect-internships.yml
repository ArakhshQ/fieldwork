name: Collect internships

# Every 4 hours, read employer job boards and refresh internships.json on the
# `data` branch. The live site downloads it every 20 minutes, so no redeploy
# is needed. Free for public repositories.
on:
  schedule:
    - cron: '23 */4 * * *'
  workflow_dispatch:
  push:
    branches: [main, phase3-live-research]
    paths:
      - 'scripts/collect-internships.mjs'
      - 'data/employers.json'
      - 'lib/locations.mjs'
      - '.github/workflows/collect-internships.yml'

permissions:
  contents: write

concurrency:
  group: data-branch
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: data
          path: out
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Collect
        run: |
          cp out/internships.json data/internships.json 2>/dev/null || true
          node scripts/collect-internships.mjs --out out/internships.json
      - name: Publish to the data branch
        working-directory: out
        run: |
          git config user.name "fieldwork-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add internships.json internships-report.json
          if git diff --cached --quiet; then echo "No changes."; exit 0; fi
          git commit -m "Internships $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do git pull --rebase -q origin data && git push -q origin HEAD:data && exit 0; sleep 5; done
          exit 1
