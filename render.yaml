services:
  - type: web
    name: fieldwork
    runtime: node
    plan: free
    buildCommand: npm ci && npm run check && npm test
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 22.16.0
      - key: NODE_ENV
        value: production
      - key: TAVILY_API_KEY
        sync: false
      - key: MAX_SEARCHES_PER_DAY
        value: "100"
      - key: MAX_CONCURRENT_SEARCHES
        value: "3"
